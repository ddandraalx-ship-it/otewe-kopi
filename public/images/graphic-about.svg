<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#aboutBg)" rx="24" />

  <!-- Minimalist Architectural Grid & Geometric Shapes -->
  <g opacity="0.4" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="600" stroke-dasharray="4 8" />
    <line x1="500" y1="0" x2="500" y2="600" stroke-dasharray="4 8" />
    <line x1="0" y1="150" x2="600" y2="150" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="600" y2="300" stroke-dasharray="4 8" />
    <line x1="0" y1="450" x2="600" y2="450" stroke-dasharray="4 8" />
  </g>

  <!-- Modern Geometric Composition -->
  <rect x="180" y="180" width="240" height="240" rx="30" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
  <circle cx="300" cy="300" r="90" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
  <polygon points="300,160 410,350 190,350" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

  <!-- Center Typographic Badge -->
  <circle cx="300" cy="300" r="45" fill="#09090B" stroke="#FFFFFF" stroke-width="2" />
  <text x="300" y="295" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">100%</text>
  <text x="300" y="315" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#A1A1AA" text-anchor="middle" letter-spacing="1">LOKAL</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="560" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />
</svg>
