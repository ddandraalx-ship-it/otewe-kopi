<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gelatoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#gelatoBg)" rx="24" />

  <!-- Abstract Gelato Cone Graphic -->
  <g transform="translate(300, 250)">
    <!-- Cone Triangle -->
    <polygon points="0,150 -50,30 50,30" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />
    <path d="M -30 30 L 20 120 M 30 30 L -20 120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Gelato Scoops (3 Layered Circles) -->
    <circle cx="0" cy="-20" r="55" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9" />
    <circle cx="-30" cy="10" r="45" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <circle cx="30" cy="10" r="45" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />

    <!-- Cherry on Top -->
    <circle cx="0" cy="-85" r="14" fill="#FFFFFF" opacity="0.9" />
    <path d="M 0 -99 C 15 -125 30 -115 35 -130" fill="none" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography Overlay -->
  <text x="300" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">GELATO & DESSERT</text>
  <text x="300" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#A1A1AA" text-anchor="middle" letter-spacing="3">SINGLE • DOUBLE • GELATOAST</text>

  <!-- Glass Border Overlay -->
  <rect x="16" y="16" width="568" height="468" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />
</svg>
