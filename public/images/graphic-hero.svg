<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#A1A1AA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272A" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24" />
  <circle cx="400" cy="300" r="280" fill="url(#glowGrad)" />

  <!-- Abstract Glassmorphic Geometric Circles -->
  <circle cx="400" cy="300" r="180" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6" />
  <circle cx="400" cy="300" r="140" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="400" cy="300" r="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />

  <!-- Minimalist Dynamic Waves (Coffee Vibe & Energy) -->
  <path d="M 100 450 Q 250 150 400 300 T 700 150" fill="none" stroke="url(#lineGrad)" stroke-width="4" />
  <path d="M 100 480 Q 250 180 400 330 T 700 180" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6" />
  <path d="M 100 510 Q 250 210 400 360 T 700 210" fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.3" />

  <!-- Abstract Steam Rise Lines -->
  <path d="M 360 260 C 350 210 380 180 370 130" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 400 280 C 390 220 420 170 410 110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 440 260 C 430 210 460 180 450 130" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Typography Accent Overlay -->
  <text x="400" y="325" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="8" opacity="0.95">OTEWE KOPI</text>
  <text x="400" y="360" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#A1A1AA" text-anchor="middle" letter-spacing="4" opacity="0.7">• EST. SURABAYA •</text>

  <!-- Outer Glass Frame Accent -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />
</svg>
